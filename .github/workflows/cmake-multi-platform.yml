name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang-19
            cpp_compiler: clang++-19
          - os: ubuntu-latest
            build_type: Release
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - uses: actions/checkout@v4

      # Both jobs are the documented floor rather than a version above it, so
      # what README.md promises is what CI proves.  g++-14 for the libstdc++ 14
      # floor (std::ranges::to), which clang on Linux compiles against too, so
      # this line feeds both jobs.  clang-19 on two counts: libstdc++ gates
      # <expected> on __cpp_concepts, first defined in 19, and Clang does not
      # define __cpp_explicit_this_parameter until 19 either -- it compiles an
      # explicit object parameter from 18 but util/config.hpp gates on the
      # macro.  libboost-dev because ddx finds Boost rather than fetching it --
      # and so does tests/package, configuring on its own.
      - name: Install compilers and Boost (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-19 gcc-14 g++-14 libboost-dev

      # The core may depend on the standard library and Boost.Mp11 and nothing
      # else.  Standard headers carry no '/', so any other angle-include with a
      # path is a third-party leak; the vendored mdspan is the one exception.
      #
      # include/rt/ gets its own rule: a separate opt-in target that may reach
      # for boost, and which the core must not depend on in either direction.
      - name: Header dependencies stay declared
        if: runner.os == 'Linux'
        shell: bash
        run: |
          angled=$(grep -rnE '#[[:space:]]*include[[:space:]]*<[^>]*/' include --include='*.hpp' \
                   | grep -v third_party | grep -v '^include/rt/' \
                   | grep -v '<boost/mp11/' || true)
          # A quoted include is one of ours and must resolve inside include/;
          # one that does not is a bundled dependency under another spelling.
          quoted=$( { grep -rnE '#[[:space:]]*include[[:space:]]*"' include --include='*.hpp' \
                       | grep -v third_party || true; } \
                   | while IFS=: read -r f n rest; do
                       h=${rest#*\"}; h=${h%%\"*}
                       [ -e "$(dirname "$f")/$h" ] || [ -e "include/$h" ] || echo "$f:$n: $h"
                     done)
          # ddx::rt's declared dependencies are Boost.Graph and Boost.DynamicBitset;
          # anything else is a leak.
          rt=$(grep -rnE '#[[:space:]]*include[[:space:]]*<[^>]*/' include/rt --include='*.hpp' \
               | grep -vE '<boost/' || true)
          # The core must never reach into rt/.
          core=$(grep -rnE '#[[:space:]]*include[[:space:]]*"rt/' include --include='*.hpp' \
                 | grep -v '^include/rt/' || true)
          if [ -n "$angled$quoted$rt$core" ]; then
            echo "a third-party header leaked into include/:"
            [ -n "$angled" ] && echo "$angled"
            [ -n "$quoted" ] && echo "$quoted"
            [ -n "$rt" ] && echo "include/rt/ may depend on boost only:" && echo "$rt"
            [ -n "$core" ] && echo "the core must not depend on rt/:" && echo "$core"
            exit 1
          fi
          echo "include/ depends on the standard library and Boost.Mp11 only (rt/: plus boost)"

      - name: Set build directory
        id: strings
        shell: bash
        run: echo "build-dir=${GITHUB_WORKSPACE}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B ${{ steps.strings.outputs.build-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      # The runner's preinstalled vcpkg: ddx finds Boost and the Windows image
      # ships none.  Headers only -- every Boost library ddx names is such.
      - name: Install Boost (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install boost-mp11 boost-graph boost-dynamic-bitset boost-describe boost-endian boost-crc --triplet x64-windows

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B "${{ steps.strings.outputs.build-dir }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -S "${{ github.workspace }}"

      - name: Build
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ matrix.build_type }}

      - name: Build tests
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ matrix.build_type }} --target tests

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
