name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang-20
            cpp_compiler: clang++-20
          - os: ubuntu-latest
            build_type: Release
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - uses: actions/checkout@v4

      # Both jobs are the documented floor rather than a version above it, so
      # what README.md promises is what CI proves.  g++-14 for the libstdc++ 14
      # floor (std::ranges::to), which clang on Linux compiles against too, so
      # this line feeds both jobs.  clang-20 because util/config.hpp gates on
      # __cpp_explicit_this_parameter, which Clang does not define until 20 --
      # 18 and 19 compile an explicit object parameter but do not advertise it.
      # Compilers only: Boost is fetched at a pinned hash and never found, and
      # an installed ddx carries the headers in its own prefix, so tests/package
      # needs none either.
      - name: Install compilers (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-20 gcc-14 g++-14

      # include/ may name the standard library and Boost, and nothing else.
      # Boost is not a third party here: it is fetched at a pinned hash and
      # installed into ddx's own prefix, so it is as present as <vector> and a
      # header should reach for the right library rather than the allowed one.
      # The vendored mdspan is the one genuine exception.
      #
      # What still holds: a quoted include resolves inside include/, and the
      # core must not depend on rt/ in either direction.
      - name: Header dependencies stay declared
        if: runner.os == 'Linux'
        shell: bash
        run: |
          angled=$(grep -rnE '#[[:space:]]*include[[:space:]]*<[^>]*/' include --include='*.hpp' \
                   | grep -v third_party | grep -v '<boost/' || true)
          # A quoted include is one of ours and must resolve inside include/;
          # one that does not is a bundled dependency under another spelling.
          quoted=$( { grep -rnE '#[[:space:]]*include[[:space:]]*"' include --include='*.hpp' \
                       | grep -v third_party || true; } \
                   | while IFS=: read -r f n rest; do
                       h=${rest#*\"}; h=${h%%\"*}
                       [ -e "$(dirname "$f")/$h" ] || [ -e "include/$h" ] || echo "$f:$n: $h"
                     done)
          # The core must never reach into rt/.
          core=$(grep -rnE '#[[:space:]]*include[[:space:]]*"rt/' include --include='*.hpp' \
                 | grep -v '^include/rt/' || true)
          if [ -n "$angled$quoted$core" ]; then
            echo "a third-party header leaked into include/:"
            [ -n "$angled" ] && echo "$angled"
            [ -n "$quoted" ] && echo "$quoted"
            [ -n "$core" ] && echo "the core must not depend on rt/:" && echo "$core"
            exit 1
          fi
          echo "include/ depends on the standard library and Boost only"

      - name: Set build directory
        id: strings
        shell: bash
        run: echo "build-dir=${GITHUB_WORKSPACE}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B ${{ steps.strings.outputs.build-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B "${{ steps.strings.outputs.build-dir }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S "${{ github.workspace }}"

      - name: Build
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ matrix.build_type }}

      - name: Build tests
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ matrix.build_type }} --target tests

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
