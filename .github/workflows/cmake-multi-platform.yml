name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-latest
            build_type: Release
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - uses: actions/checkout@v4

      # g++-14, not the image's default g++/libstdc++: the library floor is
      # libstdc++ 14 (std::ranges::to), and clang on Linux compiles against the
      # newest libstdc++ installed, so this line is what feeds both Linux jobs.
      - name: Install compilers (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang gcc-14 g++-14

      # The library depends on nothing but the standard library, and the
      # constexpr core could not use a matrix package in constant evaluation
      # anyway.  Standard headers carry no '/', so any angle-include with a path
      # is a third-party leak; the vendored mdspan copy is the one exception.
      # Recursive — the headers live in subdirectories.
      - name: Headers stay dependency-free
        if: runner.os == 'Linux'
        shell: bash
        run: |
          angled=$(grep -rnE '#[[:space:]]*include[[:space:]]*<[^>]*/' include --include='*.hpp' \
                   | grep -v third_party || true)
          # A quoted include is one of ours and must resolve inside include/;
          # one that does not is a bundled dependency under another spelling.
          quoted=$( { grep -rnE '#[[:space:]]*include[[:space:]]*"' include --include='*.hpp' \
                       | grep -v third_party || true; } \
                   | while IFS=: read -r f n rest; do
                       h=${rest#*\"}; h=${h%%\"*}
                       [ -e "$(dirname "$f")/$h" ] || [ -e "include/$h" ] || echo "$f:$n: $h"
                     done)
          if [ -n "$angled$quoted" ]; then
            echo "a third-party header leaked into include/:"
            [ -n "$angled" ] && echo "$angled"
            [ -n "$quoted" ] && echo "$quoted"
            exit 1
          fi
          echo "include/ depends on the standard library only"

      - name: Set build directory
        id: strings
        shell: bash
        run: echo "build-dir=${GITHUB_WORKSPACE}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B ${{ steps.strings.outputs.build-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B "${{ steps.strings.outputs.build-dir }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S "${{ github.workspace }}"

      - name: Build
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ matrix.build_type }}

      - name: Build tests
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ matrix.build_type }} --target tests

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
