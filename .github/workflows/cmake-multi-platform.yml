name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - uses: actions/checkout@v4

      - name: Install compilers and Eigen (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang gcc libeigen3-dev

      - name: Install Eigen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install eigen3:x64-windows

      # Eigen is required, but only at the boundary: interop/eigen_interop.hpp
      # must stay the single header that includes it, or the constexpr symbolic
      # core silently acquires a dependency it cannot use in constant
      # evaluation.  The scan is recursive — the headers live in subdirectories.
      - name: Eigen stays at the boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          offenders=$(grep -rl '#include <Eigen' include expression_differentiator.hpp \
                      | grep -v 'include/interop/eigen_interop.hpp' || true)
          if [ -n "$offenders" ]; then
            echo "Eigen leaked out of eigen_interop.hpp into:"; echo "$offenders"; exit 1
          fi
          echo "Eigen is confined to include/interop/eigen_interop.hpp"

      # Eigen is optional, so the build without it has to keep working — the
      # header is #error-guarded and its tests are #ifdef-guarded, both of which
      # rot silently if nothing exercises them.
      - name: Build and test without Eigen
        if: runner.os == 'Linux' && matrix.cpp_compiler == 'g++'
        shell: bash
        run: |
          cmake -S . -B build-no-eigen -DDIFF_USE_EIGEN=OFF \
                -DDIFF_BUILD_BENCHMARKS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-no-eigen --target tests
          ctest --test-dir build-no-eigen --output-on-failure

      - name: Set build directory
        id: strings
        shell: bash
        run: echo "build-dir=${GITHUB_WORKSPACE}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B ${{ steps.strings.outputs.build-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B "${{ steps.strings.outputs.build-dir }}"
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S "${{ github.workspace }}"

      - name: Build
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ matrix.build_type }}

      - name: Build tests
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ matrix.build_type }} --target tests

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
