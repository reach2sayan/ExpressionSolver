name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-latest
            build_type: Release
            c_compiler: gcc-14
            cpp_compiler: g++-14
          - os: windows-latest
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl

    steps:
      - uses: actions/checkout@v4

      # g++-14, not the image's default g++/libstdc++: the library floor is
      # libstdc++ 14 (std::ranges::to), and clang on Linux compiles against the
      # newest libstdc++ installed, so this line is what feeds both Linux jobs.
      - name: Install compilers (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang gcc-14 g++-14

      # The library has no third-party dependencies, and the constexpr core
      # could not use Eigen in constant evaluation anyway.  Eigen now appears
      # only in benchmarks/benchmark_compare.cpp, which needs DDX_BUILD_COMPARE
      # and is off by default.  The scan is recursive — the headers live in
      # subdirectories.
      - name: Headers stay dependency-free
        if: runner.os == 'Linux'
        shell: bash
        run: |
          offenders=$(grep -rlE '#[[:space:]]*include[[:space:]]*[<"]Eigen' include || true)
          if [ -n "$offenders" ]; then
            echo "Eigen leaked into the library headers:"; echo "$offenders"; exit 1
          fi
          echo "No Eigen under include/"

      - name: Set build directory
        id: strings
        shell: bash
        run: echo "build-dir=${GITHUB_WORKSPACE}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -B ${{ steps.strings.outputs.build-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -B "${{ steps.strings.outputs.build-dir }}"
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S "${{ github.workspace }}"

      - name: Build
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ matrix.build_type }}

      - name: Build tests
        run: cmake --build "${{ steps.strings.outputs.build-dir }}" --config ${{ matrix.build_type }} --target tests

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
